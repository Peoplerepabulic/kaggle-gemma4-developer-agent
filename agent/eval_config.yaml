# Per-task budgets, read by the harness from the `evaluation:` mapping only (starter Cell 5,
# HARNESS_README §7.1). Any other top-level key is ignored. Unset keys fall back to
# 300 s / 300 s / 100 calls / 60 min / 500 turns — that fallback is what the old
# `defaults:` layout silently got.
# Budget math: 12 h / ~120 tasks = 6 min/task including sandbox setup (not counted in
# max_time_minutes) and vLLM startup. 4 min leaves headroom until a scored run's wall
# time is known; raise only with timing data in docs/experiments.md.
evaluation:
  max_time_minutes: 4
  max_tool_calls: 40
  max_turns: 60
  timeout_seconds: 120
  verification_timeout_seconds: 300
