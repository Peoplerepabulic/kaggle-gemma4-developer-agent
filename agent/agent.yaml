# Root agent — schema per the official sample_submission/agent.yaml + HARNESS_README §2.3.
# One base model for every agent (bare alias, no provider prefix). Swap here and in
# sub_agents/*.yaml for the E4B variant. Add `adapter: <dir under adapters/>` once a LoRA exists.
name: gemma4_dev_agent
model: gemma-4-12b-it-qat-w4a16-ct
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
